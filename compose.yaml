x-app: &app
  build: .
  image: rank-it-local
  env_file: .env
  environment:
    DB_HOST: db
    DB_PORT: 5432
    IMPORT_STAGING_PATH: /var/lib/rank-it/staging
  volumes:
    - import-staging:/var/lib/rank-it/staging
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      # The temporary initialization server accepts socket connections only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres:/var/lib/postgresql/data
  web:
    <<: *app
    command: php artisan serve --host=0.0.0.0 --no-reload
    ports:
      - "0.0.0.0:8000:8000"
  worker:
    <<: *app
    command: php artisan queue:work database --timeout=60 --tries=3
    restart: on-failure

volumes:
  postgres:
  import-staging:
